<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Tool internal di balik login. /approve?t=<token> adalah rute publik
         bertoken, jadi jangan sampai ter-index. Sengaja TIDAK diblokir lewat
         robots.txt: crawler unfurl WhatsApp/Facebook menghormati robots.txt,
         memblokir di sana justru mematikan preview Open Graph di bawah. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>SellerOS — Analitik &amp; Ads Marketplace</title>
    <meta
      name="description"
      content="Analitik produk, iklan, dan campaign untuk seller Shopee &amp; TikTok: kuadran traffic vs konversi, GMV Max Ads, sampai approval campaign dalam satu tempat."
    />

    <!-- Open Graph — dipakai WhatsApp, Slack, LinkedIn, Facebook.
         og:url sengaja TIDAK diisi: link approval dibagikan sebagai
         /approve?t=<token>, jadi biarkan crawler memakai URL yang dishare
         apa adanya, bukan dipaksa ke root. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SellerOS" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="SellerOS — Analitik &amp; Ads Marketplace" />
    <meta
      property="og:description"
      content="Analitik produk, iklan, dan campaign untuk seller Shopee &amp; TikTok: kuadran traffic vs konversi, GMV Max Ads, sampai approval campaign dalam satu tempat."
    />
    <!-- og:image WAJIB absolut — crawler tidak me-resolve path relatif. -->
    <meta property="og:image" content="https://selleros.praiseagency.id/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SellerOS — analitik &amp; ads marketplace" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SellerOS — Analitik &amp; Ads Marketplace" />
    <meta
      name="twitter:description"
      content="Analitik produk, iklan, dan campaign untuk seller Shopee &amp; TikTok: kuadran traffic vs konversi, GMV Max Ads, sampai approval campaign dalam satu tempat."
    />
    <meta name="twitter:image" content="https://selleros.praiseagency.id/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
